name: Test AWS OIDC Connection

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  aws-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # MANDATORY: Allows GitHub to generate the OIDC JWT token
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::541099637338:role/oidc-github-actions-poc
          aws-region: us-east-1

      - name: Verify Authentication
        run: |
          aws sts get-caller-identity

